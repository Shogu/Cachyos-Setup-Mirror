<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Configuration fontconfig minimale pour le générateur de miniatures : le
     bac à sable des miniatures GNOME ne monte pas /etc/fonts, donc la
     configuration du système n'est pas lue. On liste donc les dossiers de
     polices possibles, y compris ceux de l'utilisateur : sans aucune police
     trouvée, Pango dessine bien la page et le bandeau mais **pas un seul
     glyphe**, et la vignette paraît vide. -->
<fontconfig>
  <!-- Si une configuration système est tout de même montée, on la reprend. -->
  <include ignore_missing="yes">/etc/fonts/conf.d</include>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir>~/.local/share/fonts</dir>
  <dir>~/.fonts</dir>
  <dir>/run/host/usr/share/fonts</dir>
  <dir>/run/host/usr/local/share/fonts</dir>
  <cachedir>/var/cache/fontconfig</cachedir>
  <cachedir>~/.cache/fontconfig</cachedir>
  <alias><family>sans-serif</family><prefer><family>Adwaita Sans</family><family>Cantarell</family><family>Noto Sans</family><family>DejaVu Sans</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Adwaita Mono</family><family>Source Code Pro</family><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
