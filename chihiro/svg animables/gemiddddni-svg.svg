<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 90" width="80" height="90">
  <defs>
    <linearGradient id="noteGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#F1C40F" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#E67E22" stop-opacity="0.8" />
    </linearGradient>
  </defs>
  <g transform="rotate(-8 40 45)">
    <!-- Têtes des notes -->
    <ellipse cx="20" cy="68" rx="9" ry="6.5" fill="url(#noteGrad2)" transform="rotate(-20 20 68)" />
    <ellipse cx="55" cy="58" rx="9" ry="6.5" fill="url(#noteGrad2)" transform="rotate(-20 55 58)" />
    <!-- Hampes -->
    <rect x="26" y="22" width="3.5" height="48" rx="1.5" fill="url(#noteGrad2)" />
    <rect x="61" y="12" width="3.5" height="48" rx="1.5" fill="url(#noteGrad2)" />
    <!-- Ligatures de liaison -->
    <polygon points="26,22 64.5,12 64.5,18 26,28" fill="url(#noteGrad2)" />
    <polygon points="26,32 64.5,22 64.5,28 26,38" fill="url(#noteGrad2)" />
