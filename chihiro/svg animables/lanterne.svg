<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <defs>
    <!-- Halo lumineux ambre très doux -->
    <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F39C12" stop-opacity="0.65" />
      <stop offset="40%" stop-color="#F1C40F" stop-opacity="0.30" />
      <stop offset="75%" stop-color="#E67E22" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#F39C12" stop-opacity="0" />
    </radialGradient>
    
    <!-- Lumière interne du papier shoje -->
    <radialGradient id="innerGlow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#FFF8DC" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#F39C12" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#D35400" stop-opacity="0.75" />
    </radialGradient>

    <!-- Ombre douce du socle -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Halo diffus extérieur pour ambiance nocturne -->
  <circle cx="100" cy="135" r="115" fill="url(#haloGrad)" />

  <!-- Structure bois de la lanterne japonaise (Andon) -->
  <g filter="url(#softGlow)">
    <!-- Pieds & Socle en bois chaud -->
    <path d="M 60,225 L 65,210 L 135,210 L 140,225 Z" fill="#4A235A" opacity="0.3" />
    <rect x="62" y="210" width="76" height="12" rx="2" fill="#5D4037" />
    <rect x="66" y="222" width="8" height="10" rx="1" fill="#3E2723" />
    <rect x="126" y="222" width="8" height="10" rx="1" fill="#3E2723" />

    <!-- Toit / Chapeau en bois -->
    <rect x="58" y="58" width="84" height="10" rx="3" fill="#5D4037" />
    <path d="M 54,58 L 146,58 L 138,48 L 62,48 Z" fill="#3E2723" />
    <circle cx="100" cy="44" r="5" fill="#8D6E63" />

    <!-- Parois en papier Shoji lumineux -->
    <rect x="66" y="68" width="68" height="142" rx="2" fill="url(#innerGlow)" />

    <!-- Piliers d'angles et quadrillage en bois (Ghibli craft style) -->
    <rect x="64" y="68" width="6" height="142" fill="#4E342E" />
    <rect x="130" y="68" width="6" height="142" fill="#3E2723" />
    
    <!-- Traverses horizontales fines -->
    <line x1="70" y1="103" x2="130" y2="103" stroke="#4E342E" stroke-width="2.5" opacity="0.85" />
    <line x1="70" y1="139" x2="130" y2="139" stroke="#4E342E" stroke-width="2.5" opacity="0.85" />
    <line x1="70" y1="175" x2="130" y2="175" stroke="#4E342E" stroke-width="2.5" opacity="0.85" />

    <!-- Motif végétal peint à la main (Style Ghibli) sur le papier -->
    <path d="M 82,185 C 85,160 95,145 110,120 M 92,152 C 100,150 108,153 112,148 M 86,170 C 92,168 98,172 102,166" stroke="#795548" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75" />
    <!-- Petites feuilles/fleurs peintes -->
    <circle cx="112" cy="148" r="3" fill="#E67E22" opacity="0.8" />
    <circle cx="102" cy="166" r="2.5" fill="#E67E22" opacity="0.8" />
  </g>
</svg>