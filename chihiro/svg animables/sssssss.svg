<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90" width="90" height="90">
  <defs>
    <!-- Rayonnement bio-lumineux chaud -->
    <radialGradient id="fireflyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4" stop-opacity="1" />
      <stop offset="30%" stop-color="#F1C40F" stop-opacity="0.8" />
      <stop offset="65%" stop-color="#E67E22" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#D35400" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Halo de lumière vacillant -->
  <circle cx="45" cy="45" r="40" fill="url(#fireflyGlow)" />

  <!-- Corps & Ailes de l'insecte (style poétique) -->
  <g transform="translate(45, 45) rotate(-15)">
    <!-- Ailes translucides légères -->
    <ellipse cx="-5" cy="-6" rx="10" ry="4" fill="#FFFFFF" opacity="0.55" transform="rotate(-30 -5 -6)" />
    <ellipse cx="5" cy="-6" rx="10" ry="4" fill="#FFFFFF" opacity="0.55" transform="rotate(30 5 -6)" />

    <!-- Petit corps sombre -->
    <ellipse cx="0" cy="-2" rx="3" ry="4" fill="#2C3E50" />
    <circle cx="0" cy="-6" r="2.5" fill="#1A252F" />

    <!-- Abdomen lumineux (Cœur vert-ambre chaud) -->
    <ellipse cx="0" cy="4" rx="4" ry="5" fill="#FFF59D" />
    <ellipse cx="0" cy="4" rx="2.5" ry="3.5" fill="#FFFFFF" />
  </g>
</svg>